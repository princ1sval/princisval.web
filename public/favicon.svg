<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon <P/> da Princípio Web: desenhado com traços, sem depender de fonte -->
  <title>Princípio Web</title>

  <!-- Fundo carbono com cantos arredondados -->
  <rect width="64" height="64" rx="14" fill="#0E1111"/>

  <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- < em cinza -->
    <polyline points="15,23 7,32 15,41" stroke="#9AA19E"/>
    <!-- P em gelo: haste vertical + barriga -->
    <path d="M20 43 V21 H27 A6.5 6.5 0 0 1 27 34 H20" stroke="#F2F2EF"/>
    <!-- / em lima: inclinada e um pouco mais alta que as outras -->
    <line x1="44" y1="17" x2="37" y2="47" stroke="#C6F432"/>
    <!-- > em cinza -->
    <polyline points="49,23 57,32 49,41" stroke="#9AA19E"/>
  </g>
</svg>
