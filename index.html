<!doctype html>
<html lang="pt-BR" class="carregando">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Princípio Web: sites profissionais</title>
    <meta
      name="description"
      content="Sites e landing pages para advogados, psicólogos e profissionais liberais. O princípio da sua presença online."
    />
    <meta name="theme-color" content="#0E1111" />
    <link rel="canonical" href="https://princisval.com.br/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph: o cartão que aparece ao compartilhar o link (WhatsApp, Instagram, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Princípio Web" />
    <meta property="og:title" content="Princípio Web: sites profissionais" />
    <meta
      property="og:description"
      content="Sites e landing pages para advogados, psicólogos e profissionais liberais. O princípio da sua presença online."
    />
    <meta property="og:url" content="https://princisval.com.br/" />
    <!-- og:image: adicionar quando a imagem de compartilhamento existir em public/ -->
  </head>

  <body>
    <!-- ================= PÁGINA "EM BREVE" =================
         Esta branch (em-breve) fica no ar em princisval.com.br enquanto o
         site completo é feito na branch main. A classe "carregando" no
         <html> liga a tela de carregamento, que aqui roda sem parar. -->
    <main class="loader">
      <!-- Título só para leitores de tela: a animação é decoração -->
      <h1 class="visualmente-oculto">Princípio Web: site em construção</h1>

      <!-- Animação no centro da tela -->
      <div class="loader__centro" aria-hidden="true">
        <p class="loader__simbolo">&lt;</p>
        <p class="loader__nome">princípio<span class="destaque">.web</span></p>
      </div>

      <!-- Texto fixo embaixo -->
      <div class="loader__aviso mono">
        <p><span aria-hidden="true">// </span>em breve</p>
        <a href="https://www.instagram.com/princisval.web/" target="_blank" rel="noopener">@princisval.web</a>
        <a href="mailto:princ1sval.dev@outlook.com">princ1sval.dev@outlook.com</a>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
